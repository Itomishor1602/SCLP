<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.jpg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Great Saint Charles Lwanga Catholic Parish | Official Website</title>
    <meta
      name="description"
      content="Official website of Great Saint Charles Lwanga Catholic Parish, a vibrant community of faith and worship."
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- React entry point -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Apply saved theme before the page loads -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");

          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");

          document.documentElement.classList.toggle("dark", theme === "dark");

          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </body>
</html>
